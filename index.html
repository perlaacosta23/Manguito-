<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manguito - Aprendé a cuidarlo</title>
    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="welcome-container">
        
        <!-- Logo de Manguito -->
        <header class="logo-box">
            <img src="manguito elementos/logomanguitoaprendeacuidarlo.svg" alt="Logo Manguito" class="logo-img">
        </header>

        <!-- Ilustración (Fondo verde + Personaje) -->
        <div class="hero-illustration">
            <img src="manguito elementos/fondo verde dtras del mango.svg" alt="" class="bg-shape">
            <img src="manguito elementos/mangoconcelular.svg" alt="Mangui saludando con el celular" class="mangui-img">
        </div>

        <!-- Textos principales -->
        <div class="text-group">
            <h2 class="welcome-title">¡Hola! Soy Mangui.</h2>
            <p class="welcome-description">
                Te ayudo a registrar y visualizar tu economía cotidiana, de forma <strong>rápida y sencilla.</strong>
            </p>
        </div>

        <!-- Botones y Enlaces -->
        <div class="action-group">
            <button id="btn-comenzar" class="btn-primary">Comenzar</button>
            <p class="login-prompt">
                ¿Ya tenés una cuenta?<br>
                <a href="#" id="link-ingresar" class="login-link">Ingresá desde acá.</a>
            </p>
        </div>

    </main>

    <script src="app.js"></script>
</body>
</html>
